<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#4f6ef7">
<meta name="description" content="梦想小镇大富翁 —— 给孩子和家庭玩的地产经营桌游。买地盖房收过路费、炒股、用道具卡、请神明附身，在玩中学会现金流与资产配置。">
<meta name="keywords" content="大富翁,梦想小镇,儿童理财,财商教育,地产游戏,股票游戏,亲子桌游">
<title>梦想小镇大富翁 · 儿童财商启蒙游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎡%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/hud.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     开场设置界面
     ══════════════════════════════════════════════════════════ -->
<div class="setup-screen" id="setupScreen">
  <div class="setup">
    <div class="setup-hero">
      <div class="setup-badge">🎡 地产经营 · 亲子桌游 · 2-4 人</div>
      <h1>梦想小镇大富翁</h1>
      <p class="setup-sub">
        买地盖房收过路费，炒股、用道具、请神明——<br>
        让对手<b class="hl">破产</b>，或成为<b class="hl">总资产第一</b>的大亨！
      </p>
    </div>

    <!-- 玩家人数 -->
    <div class="field">
      <div class="field-label">玩家人数 <span class="hint">含电脑玩家</span></div>
      <div class="seg" id="countSeg">
        <button data-count="2">2 人<small>亲子对局</small></button>
        <button data-count="3">3 人<small>一家三口</small></button>
        <button data-count="4">4 人<small>热闹开局</small></button>
      </div>
    </div>

    <!-- 局时长 -->
    <div class="field">
      <div class="field-label">局时长 <span class="hint">决定多少轮结束</span></div>
      <div class="mode-grid" id="modeGrid">
        <button class="mode-card" data-mode="quick">
          <div class="mc-name">⚡ 快速局</div>
          <div class="mc-desc">20 轮 · 约 10 分钟<br>适合第一次玩</div>
        </button>
        <button class="mode-card" data-mode="standard">
          <div class="mc-name">⚖️ 标准局</div>
          <div class="mc-desc">35 轮 · 约 20 分钟<br>完整体验全部系统</div>
        </button>
        <button class="mode-card" data-mode="marathon">
          <div class="mc-name">🏔️ 马拉松</div>
          <div class="mc-desc">60 轮 · 约 40 分钟<br>为真正的地产大亨准备</div>
        </button>
      </div>
    </div>

    <!-- 玩家配置 -->
    <div class="field">
      <div class="field-label">选择角色 <span class="hint">可改名字，可切换真人 / 电脑</span></div>
      <div id="playerSetupList"></div>
    </div>

    <!-- 选项 -->
    <div class="field">
      <div class="opt-row">
        <button class="opt on" id="optSound"><span class="oi">🔊</span>音效</button>
        <button class="opt on" id="optCoach"><span class="oi">🎓</span>新手引导</button>
        <button class="opt on" id="optAutosave"><span class="oi">💾</span>自动存档</button>
      </div>
    </div>

    <div class="setup-actions">
      <button class="btn btn-primary btn-lg" id="btnStart">🎬 开始游戏</button>
      <button class="btn btn-soft" id="btnContinue">📂 继续上次</button>
      <button class="btn btn-soft" id="btnHelp">📖 玩法说明</button>
    </div>

    <div class="setup-foot">零依赖 · 纯网页 · 手机平板都能玩</div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     游戏主界面
     ══════════════════════════════════════════════════════════ -->
<div class="game-screen hidden" id="gameScreen">
  <header class="topbar">
    <div class="tb-left">
      <span class="tb-logo">🎡 梦想小镇</span>
      <div class="tb-round" id="roundInfo"></div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="btnSave" title="保存进度">💾</button>
      <button class="tb-btn" id="soundFab" title="音效开关">🔊</button>
    </div>
  </header>

  <div class="news-bar" id="newsBar"></div>

  <main class="game-main">
    <!-- 左：棋盘 -->
    <section class="board-col">
      <div class="board-shell">
        <div class="board-stage">
          <div class="board" id="board"></div>
          <div class="board-center" id="boardCenter"></div>
        </div>
      </div>
      <div class="hand-bar" id="handBar"></div>
    </section>

    <!-- 右：玩家 + 报表 + 日志 -->
    <aside class="side-col">
      <div class="panel">
        <div class="panel-head">👥 玩家</div>
        <div class="players-deck" id="playersDeck"></div>
      </div>

      <div class="panel panel-report">
        <div class="panel-head">
          🧮 财务报表
          <div class="report-tabs" id="reportTabs">
            <button data-tab="cashflow" class="active">收支表</button>
            <button data-tab="balance">资产负债表</button>
            <button data-tab="compare">总览</button>
          </div>
        </div>
        <div class="report-body" id="reportBody"></div>
      </div>

      <div class="panel panel-log">
        <div class="panel-head">📜 小镇动态</div>
        <div class="log" id="log"></div>
      </div>
    </aside>
  </main>
</div>

<!-- ══════════════════════════════════════════════════════════
     弹窗 / 引导 / 结算 / Toast
     ══════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox"></div>
</div>

<div class="coach-overlay hidden" id="coachOverlay">
  <div class="coach-tip" id="coachTip"></div>
</div>

<div class="result-screen hidden" id="resultScreen">
  <div class="result-card" id="resultCard"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- 脚本：依赖单向，顺序加载 -->
<script src="js/data/world.js"></script>
<script src="js/data/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/board.js"></script>
<script src="js/hud.js"></script>
<script src="js/report.js"></script>
<script src="js/game/estate.js"></script>
<script src="js/game/finance.js"></script>
<script src="js/game/cardsys.js"></script>
<script src="js/game/engine.js"></script>
<script src="js/game/ai.js"></script>
<script src="js/game/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
